name: CI

# Five jobs, five distinct axes. They are not five spellings of one check and
# a green run must not be read as a single verdict:
#
#   build            the Lean package elaborates on its own toolchain
#   lean4checker     an independent kernel accepts the proofs on replay --
#                    and says NOTHING about axioms; it exits 0 on a sorry
#   emitter          the axiom closure is within the allowlist, no sorryAx,
#                    and the emission is non-vacuous with its @[cites] intact
#   contract         the schemas compile, and no schema declares a forbidden
#                    property name (arXMCP CLAUDE.md 4.9, mechanised)
#   no-dependencies  the leaf property the named exception rests on
#
# `no-dependencies` is still the reason this file exists. This package is the
# single named exception to a consuming repo's one-pin rule, and that exception
# is argued from having zero transitive dependencies. A `[[require]]` added here
# in good faith would silently invalidate that argument in every topic repo
# that took this package. So it fails the build instead. Note it greps
# lakefile.toml -- the Python and JSON under contract/ cannot reach it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          # Deliberately NOT set: use-mathlib-cache. There is no Mathlib here,
          # and asking for its cache would imply otherwise.
          #
          # nanoda: false, and NOT because the axis does not matter.
          #
          # `nanoda: true` cannot work at this toolchain, measured end to end:
          #
          #   1. lean-action's run_nanoda.sh detects the module name with
          #      `grep -A5 '^\[package\]' lakefile.toml`. This lakefile uses the
          #      modern top-level-key form, and Lake REJECTS the `[package]`
          #      table the grep wants -- `missing required key: name`. So the
          #      form the action requires is not a form Lake accepts, and the
          #      action exposes no input to supply the name instead.
          #   2. Past that, `leanprover/lean4export` master now emits NDJSON
          #      format 3.1.0, while nanoda 0.3.2 expects the older
          #      space-separated `format2024` -- both its `debug` and `v2025`
          #      branches abort with `invalid digit found in string`.
          #   3. The exporter that does emit `format2024`,
          #      `ammkrn/lean4export@format2024`, is pinned to v4.20.0-rc5 and
          #      fails to compile at v4.29.0.
          #
          # So the Rust-kernel axis is genuinely unavailable here, and it reads
          # not_run rather than pass. The `lean4checker` job below supplies the
          # independent-kernel axis it was meant to cover.
          nanoda: false

  # Replay every declaration through the kernel, in a checker that is not the
  # one that elaborated them.
  #
  # This is a DIFFERENT AXIS from the axiom audit, and the two must not be read
  # as one. lean4checker answers "does the kernel accept these proofs when
  # replayed from scratch". It says nothing about which axioms they rest on:
  # run against a fixture carrying `set_option maxHeartbeats 400000 in theorem
  # sneaky : False := by sorry`, it exits 0, correctly -- a sorry-backed proof
  # is kernel-valid, resting on the legitimately declared `sorryAx`.
  #
  # The axiom axis is the `emitter` job. Neither substitutes for the other.
  lean4checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          nanoda: false

      - name: build lean4checker at this repo's toolchain
        run: |
          set -euo pipefail
          # Exact commit, never a branch -- the same rule the Lean pins follow.
          # Head of bump_to_v4.29.0-rc8; there is no stable v4.29.0 tag yet
          # (latest is v4.28.0). Bump deliberately when lean-toolchain moves.
          git -C /tmp clone https://github.com/leanprover/lean4checker.git
          git -C /tmp/lean4checker checkout \
            0b1d9eefeae6eb692d587fd325704856399b5caa
          # Build it against OUR toolchain, not its own: a checker running a
          # different Lean than the one under test is not evidence about this
          # environment. That is the same error the corpus server's Lean
          # verdict makes, and this repo does not get to make it too.
          cp lean-toolchain /tmp/lean4checker/lean-toolchain
          cd /tmp/lean4checker && lake build

      - name: replay the environment
        run: |
          set -euo pipefail
          for mod in MathFormalContract MathFormalContractTest; do
            echo "::group::lean4checker $mod"
            lake env /tmp/lean4checker/.lake/build/bin/lean4checker "$mod"
            echo "::endgroup::"
          done

  # The axiom axis, and the vacuous-pass guard, run through the emitter itself.
  #
  # `builds_clean` and `axiom_count: 0` stop being assertions about one
  # workstation only when something reproduces them. This is that something.
  emitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          nanoda: false

      - name: emit, and fail on sorryAx
        run: |
          set -euo pipefail
          # Non-zero exit here means a constant's axiom closure contains
          # sorryAx. The artifact is written either way, on purpose.
          lake exe mfc_emit_self --out attest/lean-emission.json
          lake exe mfc_emit_selftest --out attest/test-emission.json

      - name: the emission is not vacuous
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys

          lib = json.load(open("attest/lean-emission.json"))
          test = json.load(open("attest/test-emission.json"))
          fail = []

          # An empty emission is the observable signature of a mis-scoped
          # emitter, and it is indistinguishable from a clean one unless
          # something asserts otherwise.
          if lib["counts"]["in_scope"] < 1:
              fail.append("library emission swept 0 in-scope constants")
          if not lib["constants"]:
              fail.append("library emission has no constants[]")

          # Extension state arrives EMPTY rather than absent when
          # `importModules` is called without `loadExts := true`. Measured:
          # every cites[] empty, exit 0, artifact valid. Guard it.
          cited = [c for c in test["constants"] if c["cites"]]
          if len(cited) < 7:
              fail.append(f"expected >=7 cited decls in the test emission, got {len(cited)}")

          for doc, name in ((lib, "library"), (test, "test")):
              for c in doc["constants"]:
                  if "sorryAx" in c["axioms"]:
                      fail.append(f"{name}: {c['name']} depends on sorryAx")
                  if c["axioms"] != sorted(c["axioms"]):
                      fail.append(f"{name}: {c['name']} axioms unsorted")

          if fail:
              print("\n".join("::error::" + f for f in fail))
              sys.exit(1)
          print(f"ok: {lib['counts']['in_scope']} in-scope constants, "
                f"{len(cited)} cited declarations, no sorryAx")
          PY

  # The contract half. Python, and deliberately NOT part of `build` -- a Lean
  # build failure and a schema-lint failure are different facts and should not
  # share a green check.
  #
  # This job does not touch the zero-dependency invariant: that is enforced by
  # `no-dependencies` below, which greps lakefile.toml. JSON and Python appear
  # in neither lakefile.toml nor lake-manifest.json.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install the package rather than running it from the tree. ADR-0009
      # makes `mfc` a SHARED tool, so what CI must prove is that a CONSUMER
      # can install and run it -- including that the schemas ship inside the
      # wheel. Running `python -m` from the source tree proves neither.
      - name: install mfc
        run: python -m pip install --quiet './contract[yaml,test]'

      # The schemas must themselves be valid 2020-12 schemas. A schema that
      # does not compile validates nothing, and would otherwise pass silently.
      - name: schemas are valid JSON Schema 2020-12
        run: |
          python - <<'PY'
          import json, pathlib, sys, jsonschema
          paths = sorted(pathlib.Path("contract/mfc/schema").glob("*.schema.json"))
          if not paths:
              print("::error::no schemas found -- an empty sweep is not a pass")
              sys.exit(1)
          for p in paths:
              jsonschema.Draft202012Validator.check_schema(json.loads(p.read_text()))
              print(f"ok: {p.name}")
          PY

      # Turns arXMCP CLAUDE.md 4.9 from a review habit into a build failure.
      # The installed entry point, from a directory that is not the source
      # tree -- this is what catches schemas that failed to ship in the wheel.
      - name: mfc lint-schemas (installed)
        run: cd "$RUNNER_TEMP" && mfc lint-schemas

      # The lint must FIRE, not merely pass. A gate with no failing case is not
      # evidence, so the rejection fixtures are asserted to be rejected.
      - name: rejection fixtures are rejected
        run: |
          set +e
          mfc lint-schemas --schema-dir contract/testdata/schemas/invalid
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::rejection fixtures must exit 1, got $code -- the lint is not firing"
            exit 1
          fi
          echo "ok: rejection fixtures rejected with exit 1"

      # Every schema must ACCEPT its filled instance and every cross-field rule
      # must REJECT something. Five of the seven schemas were authored from an
      # instance plus prose rather than transcribed, so "accepts its own
      # instance" is the only check that the authoring did not drift -- and a
      # conditional that never fires is indistinguishable from one that is not
      # there.
      # Every valid artifact must validate against the schema it DECLARES.
      - name: mfc validate, over every filled instance
        run: |
          set -euo pipefail
          for f in contract/testdata/artifacts/valid/*.json; do
            mfc validate "$f"
          done

      # ...and every rejection fixture must FAIL, with exit 1 specifically.
      # Exit 2 would mean the check did not run, which is not the same fact.
      - name: rejection artifacts are rejected
        run: |
          set -euo pipefail
          for f in contract/testdata/artifacts/invalid/*.json; do
            python - "$f" <<'PY' > "$RUNNER_TEMP/probe.json"
          import json, sys
          d = json.load(open(sys.argv[1])); d.pop("$comment_fixture", None)
          print(json.dumps(d))
          PY
            set +e; mfc validate "$RUNNER_TEMP/probe.json"; code=$?; set -e
            if [ "$code" -ne 1 ]; then
              echo "::error::$(basename "$f") must exit 1, got $code -- a cross-field rule is not firing"
              exit 1
            fi
            echo "ok: $(basename "$f") rejected"
          done

      - name: pytest
        run: python -m pytest contract/tests -q

  no-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lakefile declares no dependencies
        run: |
          if grep -qE '^\s*\[\[require\]\]' lakefile.toml; then
            echo "::error file=lakefile.toml::This package must have ZERO dependencies."
            echo ""
            echo "It is the single named exception to the consuming repo's one-pin rule,"
            echo "and the exception is argued FROM the leaf property. Adding a require"
            echo "does not make this package heavier -- it makes the exception lapse,"
            echo "and the dependency comes out of every topic repo that took this one."
            exit 1
          fi
          echo "ok: no [[require]] in lakefile.toml"

      - name: manifest resolves to no packages
        run: |
          # Check the packages array, NOT a count of '"name"' keys -- the
          # manifest carries a top-level "name" for the package itself, so
          # counting them reports 1 on a correct manifest. (Caught by running
          # this guard locally before trusting it.)
          if [ -f lake-manifest.json ]; then
            if ! grep -qE '"packages"\s*:\s*\[\s*\]' lake-manifest.json; then
              echo "::error file=lake-manifest.json::manifest resolves dependencies; expected none"
              cat lake-manifest.json
              exit 1
            fi
          fi
          echo "ok: manifest resolves no packages"

# The axiom guard is NOT here, deliberately.
#
# The obvious third job is `grep -rn native_decide --include=*.lean` — it
# injects `Lean.ofReduceBool`, outside the allowlist this contract enforces.
# Do not add it. A source grep is the exact failure this whole project
# documents: the corpus server audits Lean declarations by regex over source,
# that regex does not recognise `set_option … in theorem` as a declaration
# site, and a sorry-backed proof rides through inside a "clean" verdict. The
# grep here fails the same way, and additionally false-positives on the prose
# in test/ that explains why not to use it.
#
# The real guard runs at BUILD time, over `Environment.constants`, in
# test/MathFormalContractTest.lean: sweep every `MathFormalContract.*`
# declaration, `collectAxioms` each one, fail on anything outside
# [propext, Classical.choice, Quot.sound], and fail if the sweep saw zero
# declarations (a vacuous pass). It cannot miss a declaration, because there is
# no text for one to hide in. Verified against a deliberately laundered
# `native_decide` proof: swept 74, flagged 1.
#
# `build` above therefore already enforces it, and the `emitter` job enforces
# it a second time on the shipped artifact rather than on the build log.
#
# ---------------------------------------------------------------------------
# What each job is evidence FOR. They are four axes, not four spellings of one.
#
#   build          the package elaborates under its own toolchain
#   lean4checker   an independent kernel accepts the proofs on replay --
#                  and says NOTHING about axioms; it exits 0 on a sorry
#   emitter        the axiom closure is within the allowlist, no sorryAx, and
#                  the emission is non-vacuous with its @[cites] intact
#   no-dependencies  the leaf property that the named exception rests on
#
# No job's result may be read as another's, and there is no aggregate. That is
# the same rule this package exists to enforce on its own artifacts, applied to
# its own CI.
# ---------------------------------------------------------------------------
